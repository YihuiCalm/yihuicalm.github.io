    Silicon Tapeouts:
      - name: "SpineLink: 32-neuron asynchronous spiking-neural-network chip (TSMC 180 nm, 1 mm² die)"
        url: /projects/spinelink_tapeout/
        start_date: 2026-06
        end_date: 2026-06
        summary: "Lead digital designer. Clockless tree-spine NoC of 18 bundled-data micropipeline routers, 1,152 SPI-programmed synapses, asynchronous SerDes chip-to-chip links; RTL to GDS in Genus/Innovus, integration with 32 analog LIF neurons in Virtuoso, full-chip Calibre DRC/LVS. Post-layout: 3.8 ns and 17 pJ per router hop, 412 fJ per spike, 1.9 µW digital static power."
      - name: "Synthesizable asynchronous AER encoder (TSMC 65 nm, TSRI shuttle)"
        start_date: 2025-05
        end_date: 2025-05
        summary: "RTL, PnR, pad-frame routing, sign-off and bring-up. 8-event bundled-data encoder built from standard cells only. Measured on silicon: 33 MEvent/s, 50 ns latency, 435 fJ/event, 8.7 µW. Published at IEEE MWSCAS 2026."

    Experience:
      - company: Shah Lab, University of Maryland
        position: Graduate Research Assistant
        location: College Park, MD
        url: https://sites.google.com/umd.edu/shahlab
        start_date: 2024-09
        end_date: present
        summary: Lead digital designer on the two tapeouts above.
        highlights:
          - "MURI program: contribute to the ARO MURI on hybrid artificial-living neural networks (lead: Prof. Wolfgang Losert), which seeks to identify the learning rules of biological neurons and replicate them in silicon spiking networks"
          - "Hardware readout: spiking-neural-network decoder on FPGA that classifies responses of a simulated neuron culture and identifies the most informative readout timescale (9.2 pJ per synaptic op; npj manuscript under review)"
          - "NoC exploration: evaluated five network-on-chip topologies against the sparse, event-driven traffic of spiking neurons with closed-form models and synthesized routers; the resulting tree-spine SpineLink NoC needs 2.9× less router area than a 2-D mesh at 1,024 neurons and 17 vs 48 nJ per broadcast spike"
          - "Clockless methodology: bundled-data micropipelines with automated timing closure (set_max_delay iteration, SDF simulation) in a standard Genus/Innovus flow, so power scales with neural activity; proven on 65 nm silicon, open source"
          - "Current work: 28 nm asynchronous LIF core with local SRAM synapses and 3-D neuron stacking"

      - company: ADAM Lab, George Washington University
        position: Graduate Research Assistant
        location: Washington, DC
        start_date: 2023-09
        end_date: 2024-09
        highlights:
          - "Implemented Izhikevich spiking neuron network in 16-bit fixed-point on Xilinx FPGA"
          - "Designed pipelined and multiplexed compute units for scalable on-chip SNN deployment"
          - "Modeled hardware-efficient synapse and neuron behavior with cortical cell parameters"

    Publications:
      - title: "An Ultra-Low-Power Synthesizable Asynchronous AER Encoder for Neuromorphic Edge Devices"
        authors:
          - Yihui Wang
          - Sheng-Yu Peng
          - Sahil Shah
        publisher: IEEE MWSCAS
        releaseDate: 2026
        url: https://arxiv.org/abs/2604.05313
        summary: "Accepted. 8-event asynchronous AER encoder fabricated in 65 nm CMOS with a purely standard-cell flow; measured 33 MEvent/s, 50 ns latency, 435 fJ/event."
      - title: "The Choice of Timescales in Hybrid Biological-Artificial Networks"
        authors:
          - Jake A. Miller
          - Yihui Wang
          - Ching-Yi Lin
          - Sahil Shah
          - Wolfgang Losert
        publisher: npj Unconventional Computing
        releaseDate: 2026
        summary: "Under review. Simulated biological network plus an FPGA spiking decoder; characterizes the optimal readout timescale for a hybrid computing architecture."
      - title: "SpineLink: A Fully Asynchronous Tree-Spine NoC with In-Network Broadcast and Convergecast for Multi-Chip Neuromorphic Systems"
        authors:
          - Yihui Wang
          - Sahil Shah
        publisher: IBM IEEE CAS/EDS AI Compute Symposium
        releaseDate: 2026
        summary: "Poster, accepted."

    Projects:
      - name: "EEG Signal Encoder and SNN SoC"
        url: https://github.com/YihuiCalm/Blink-Twice-For-Help
        summary: "2-4-4-2 SNN for real-time EEG blink-state classification, integrated with analog LNA and delta-modulation encoder. 106.5 µW total power at 300 Hz. Synthesis and PnR in SkyWater 130nm."
        start_date: 2025-05
        end_date: 2025-05

      - name: "LIF Spiking Decoder on FPGA"
        url: https://github.com/YihuiCalm/LIF_Decoder_For_Reservior_Computing_on_FPGA
        summary: "811-input, 10-neuron LIF decoder on a Spartan-7 at 100 MHz: 97.9% accuracy, 9.2 pJ per synaptic operation, 1,323 LUTs, 0 DSPs; bit-accurate Python model and self-checking testbenches."
        start_date: 2026-01
        end_date: 2026-09

      - name: "MIPS32 Pipelined CPU"
        url: https://github.com/YihuiCalm/MIPS32_Pipeline_CPU_Chip_Design
        summary: "5-stage pipelined MIPS32 CPU with hazard resolution. Synthesis with scan-chain insertion (Synopsys DC), PnR at 50 MHz on AMI 0.5 µm CMOS (Cadence Innovus)."
        start_date: 2023-11
        end_date: 2023-11

      - name: "Digital Design Flow Automation"
        url: https://github.com/YihuiCalm/Digital_Design_Flow
        summary: "Open-source RTL-to-GDS Tcl flow (Genus, Innovus, Xcelium) with post-synthesis and post-route SDF simulation for TSMC 180/65/28 nm and SkyWater 130 nm; used for both tapeouts and by lab members (18 GitHub stars)."
        start_date: 2025
        end_date: present

      - name: "Izhikevich Neuron FPGA"
        url: https://github.com/YihuiCalm/IZ_Neuron_FPGA
        summary: "FPGA implementation of the Izhikevich spiking neuron model in Verilog."
        start_date: 2024
        end_date: 2024

